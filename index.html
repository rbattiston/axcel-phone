<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Axcel</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header id="bar">
  <span id="link" class="pill">disconnected</span>
  <span id="rate" class="dim"></span>
  <span id="batt" class="dim right"></span>
</header>

<div id="version" class="dim">checking…</div>

<main>
  <!-- Mounting: the highest-value display. A set with no still period cannot be
       analysed at all, and that is only fixable while still at the machine. -->
  <section id="mount" class="card">
    <div id="bubble-wrap"><canvas id="bubble" width="88" height="88"></canvas></div>
    <div id="mount-text">
      <div id="up">up = ?</div>
      <div id="tilt" class="dim">tilt —</div>
      <div id="still" class="dim">waiting for data</div>
    </div>
  </section>

  <section class="card">
    <canvas id="trace" height="150"></canvas>
    <div class="dim small">accel magnitude, last 8 s</div>
  </section>

  <section id="state" class="card big">press the device button to start a set</section>

  <!-- Shown when a set ends. These labels cannot be reconstructed afterwards,
       which is why the form matters more than any of the plots above. -->
  <section id="form" class="card hidden">
    <h2>Set finished — label it</h2>
    <label>Exercise
      <input id="f-exercise" list="exercise-list" autocomplete="off" placeholder="type to search">
      <datalist id="exercise-list"></datalist>
    </label>
    <div class="row">
      <label>Load <input id="f-load" type="number" inputmode="decimal" step="any"></label>
      <label>Unit
        <select id="f-unit"><option>lb</option><option>kg</option></select>
      </label>
      <label>Set <input id="f-set" type="number" inputmode="numeric" value="1"></label>
    </div>
    <div class="row">
      <label>Reps <input id="f-reps" type="number" inputmode="numeric"></label>
      <label>RIR <input id="f-rir" type="number" inputmode="numeric"></label>
    </div>
    <label>Note <input id="f-note" placeholder="optional"></label>
    <div id="f-summary" class="dim small"></div>
    <div class="row">
      <button id="f-save" class="primary">Save set</button>
      <button id="f-discard">Discard</button>
    </div>
  </section>

  <section class="card">
    <h2>This session</h2>
    <ol id="sets" class="dim"><li class="dim">nothing yet</li></ol>
  </section>
</main>

<footer>
  <button id="connect" class="primary">Connect</button>
  <button id="export">Export</button>
  <button id="wipe">Wipe</button>
</footer>

<!--
  Version display, deliberately INLINE and deliberately not a module.

  It has to survive the failure it exists to report. A stale cached app.js
  beside a fresh index.html is a real state -- a CDN can serve the two from
  different cache generations, and a service worker will hold an old script
  indefinitely -- and in that state anything living in app.js never runs. The
  first attempt put this display there and the result was a permanent "v—",
  which told the user nothing except that something was wrong.

  So: this compares what is RUNNING (a global the module sets) against what is
  DEPLOYED (fetched with no-store), and can always offer a hard reset.
-->
<script>
(function () {
  var el = document.getElementById('version');
  function show(text, cls) { el.textContent = text; el.className = cls || 'dim'; }

  // Every file the app loads. Listed here because the reset has to refresh the
  // browser's HTTP cache entry for each one by its exact URL.
  var ASSETS = ['./index.html', './app.js', './decode.js', './stillness.js',
                './exercises.js', './thresholds.js', './version.js',
                './style.css', './sw.js', './manifest.json'];

  // Clear every cache and service worker, then reload from the network.
  //
  // There are TWO caches and clearing one is not enough. caches.delete() empties
  // the Cache Storage API, which is what the service worker uses. The browser's
  // own HTTP cache is separate and untouchable from script -- and GitHub Pages
  // serves with max-age=600, so for ten minutes Chrome will keep handing back
  // the same stale app.js however much service worker state is destroyed. That
  // produced a reset loop: fresh version.js, stale app.js, forever.
  //
  // fetch(url, {cache: 'reload'}) is the escape. It bypasses the HTTP cache AND
  // writes the fresh response into it, so the reload that follows gets new
  // files. No query string: a query would create a different cache entry and
  // leave the real one exactly as stale as before.
  function hardReset() {
    show('resetting…', 'checking');
    var jobs = [];
    if ('serviceWorker' in navigator) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
        return Promise.all(rs.map(function (r) { return r.unregister(); }));
      }));
    }
    if (window.caches) {
      jobs.push(caches.keys().then(function (ks) {
        return Promise.all(ks.map(function (k) { return caches.delete(k); }));
      }));
    }
    Promise.all(jobs)['catch'](function () {}).then(function () {
      return Promise.all(ASSETS.map(function (u) {
        return fetch(u, { cache: 'reload' })['catch'](function () {});
      }));
    })['catch'](function () {}).then(function () {
      location.replace(location.pathname);
    });
  }
  window.__axcelHardReset = hardReset;

  function verdict(latest) {
    var running = window.__axcelVersion;
    if (!running) {
      show('app.js did not load — tap to reset', 'stale');
      el.onclick = hardReset;
    } else if (latest && latest !== running) {
      show('stale build — tap to update', 'stale');
      el.onclick = hardReset;
    } else {
      show('v' + running + (latest ? '' : ' (offline)'));
      el.onclick = function () {
        show('checking…', 'checking');
        check(true);
      };
    }
  }

  function check(force) {
    fetch('./version.js?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var m = t.match(/VERSION = "([^"]*)"/);
        var latest = m ? m[1] : null;
        if (force && latest && latest === window.__axcelVersion) {
          show('v' + latest + ' — up to date', 'fresh');
          setTimeout(function () { verdict(latest); }, 3000);
        } else {
          verdict(latest);
        }
      })['catch'](function () { verdict(null); });
  }

  // Give the module a moment to load and publish its version before judging it.
  setTimeout(function () { check(false); }, 900);
})();
</script>

<script type="module" src="./app.js"></script>
</body>
</html>
